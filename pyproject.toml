[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "videofixie"
version = "0.1.0"
description = "Desktop orchestration layer for repeatable video restoration previews and jobs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
videofixie = "videofixie.cli:main"
videofixie-gui = "videofixie.ui.app:main"

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = []

[tool.setuptools.packages.find]
include = ["videofixie*"]
